setw -g mode-keys vi

# The backgrounds have a relative luminance of roughly 0.17--0.18.  This keeps
# the bar distinct from both light and dark terminal panes while retaining at
# least a 4.5:1 contrast ratio with its white foreground text.
set -g status-style "__TMUX_STATUS_STYLE__"
set -g extended-keys on
setw -g mouse on

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

set -g @yank_action "copy-pipe"
